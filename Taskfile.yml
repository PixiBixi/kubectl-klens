version: '3'

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the local kubectl-klens binary
    cmds:
      - go build -ldflags "-s" -o kubectl-klens .

  lint:
    desc: 'Run golangci-lint (config: .golangci.yml)'
    cmds:
      - golangci-lint run

  lint-md:
    desc: Run markdownlint-cli as CI does (task lint-md -- <paths>)
    cmds:
      - npx --yes markdownlint-cli@0.49.1 --ignore dist {{.CLI_ARGS | default "."}}

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  snapshot:
    desc: Build a goreleaser snapshot (dry-run release)
    cmds:
      - goreleaser release --snapshot --clean

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f kubectl-klens
      - rm -rf dist/
