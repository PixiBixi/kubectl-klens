version: "2"

run:
  timeout: 5m

linters:
  default: standard # govet, staticcheck, errcheck, ineffassign, unused
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - durationcheck
    - errorlint
    - forcetypeassert
    - gosec
    - gocritic
    - misspell
    - modernize
    - nilerr
    - noctx
    - perfsprint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    gocritic:
      # The performance tag is what catches copies of the fat k8s API structs
      # (corev1.Pod is 1192 bytes, Node 768, Container 408) in per-object loops,
      # which is where they actually cost something.
      enabled-tags:
        - performance
      settings:
        hugeParam:
          # Default is 80, which also flags the config structs this codebase
          # deliberately passes by value: kube.Flags (104 B) and cli.App (96 B)
          # are threaded through every RunFunc signature by design, and are
          # copied once per process. Making them pointers would ripple through
          # ~25 view signatures, invite accidental mutation of shared flags, and
          # save nothing measurable. 256 keeps the check pointed at API objects.
          sizeThreshold: 256
    errcheck:
      # Output writers: a failed write to stdout/pipe is not actionable here.
      exclude-functions:
        - (*text/tabwriter.Writer).Flush
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G104 # unhandled errors: fully overlaps errcheck, which is tuned above
    revive:
      rules:
        # Style rules inappropriate for this internal, non-published codebase.
        - name: package-comments
          disabled: true
        - name: exported # internal/ packages are not a public API
          disabled: true
        - name: redefines-builtin-id # min/max/cap as local names is readable here
          disabled: true
        - name: unused-parameter # views share a fixed RunFunc signature
          disabled: true
  exclusions:
    rules:
      # gosec on tests is noisy (file perms, variable file inclusion) and not
      # a runtime concern.
      - path: _test\.go
        linters:
          - gosec

issues:
  # Show every finding. The defaults (max-issues-per-linter 50, max-same-issues 3)
  # silently hide repeats, which on this codebase meant most of the identical
  # "copies 1192 bytes" hits never appeared - a fix looked complete when it was
  # not. On a repo this size there is no reason to cap.
  max-issues-per-linter: 0
  max-same-issues: 0
