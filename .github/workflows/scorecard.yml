name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [master]
  schedule:
    # Weekly: the score is a regression detector, not a per-commit gate.
    - cron: "17 5 * * 1"

permissions: {}

jobs:
  analysis:
    name: Analyze
    runs-on: ubuntu-26.04
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write        # keyless signing of the published result
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The Branch-Protection check reads settings the GITHUB_TOKEN cannot
          # see; without this PAT it returns inconclusive. Everything else runs
          # either way, so an unset secret degrades rather than fails.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          # Publishes to api.securityscorecards.dev, which is what
          # dependency-review-action reads when someone evaluates this repo.
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
