name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [master]
  schedule:
    # Weekly: the score is a regression detector, not a per-commit gate.
    - cron: "17 5 * * 1"

permissions: {}

jobs:
  analysis:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write        # keyless signing of the published result
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # The Branch-Protection check reads settings the GITHUB_TOKEN cannot
          # see; without this PAT it returns inconclusive. Everything else runs
          # either way, so an unset secret degrades rather than fails.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          # Publishes to api.securityscorecards.dev, which is what
          # dependency-review-action reads when someone evaluates this repo.
          publish_results: true

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
