name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [master]
  schedule:
    # Weekly: the score is a regression detector, not a per-commit gate.
    - cron: "17 5 * * 1"

permissions: {}

jobs:
  analysis:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write        # keyless signing of the published result
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The Branch-Protection check reads settings the GITHUB_TOKEN cannot
          # see; without this PAT it returns inconclusive. Everything else runs
          # either way, so an unset secret degrades rather than fails.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
          # Publishes to api.securityscorecards.dev, which is what
          # dependency-review-action reads when someone evaluates this repo.
          publish_results: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
