name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The Release job installs svu with this same toolchain: fail on the PR
      # when a svu bump needs a newer go directive, not after the merge.
      - name: Check svu installs with this toolchain
        run: |
          set -euo pipefail
          SVU_VERSION=$(sed -n 's/^ *SVU_VERSION: *//p' .github/workflows/release.yml)
          test -n "$SVU_VERSION"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/caarlos0/svu/v3@${SVU_VERSION}"
      - name: Verify dependencies
        run: go mod verify
      - name: Build
        run: go build -v ./...
      - name: Tests
        run: go run gotest.tools/gotestsum@v1.13.0 --junitfile junit.xml -- -race -coverprofile=coverage.out ./...
      # annotate_only: no check run, so no checks: write and fork PRs still get annotations.
      - name: Test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          report_paths: junit.xml
          annotate_only: true
      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
