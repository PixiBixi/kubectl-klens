name: Validate PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  validate:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      # The squash commit takes the PR title, and svu computes the next version
      # from those commits. A title outside the convention means svu sees nothing
      # releasable and the release is skipped silently, with no error anywhere.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
